[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chzzk-shorts-demo"
version = "0.2.0"
description = "CHZZK VOD highlight discovery and vertical Shorts rendering demo"
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2025.3.25", "numpy>=1.26,<3"]

[project.optional-dependencies]
gpu = ["faster-whisper>=1.2,<2", "av>=11,<17"]
ai = ["google-genai>=1,<2"]
render = ["Pillow>=10,<13"]

[project.scripts]
chzzk-demo = "chzzk_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
